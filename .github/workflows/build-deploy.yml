name: Build and deploy site
# 数据或构建脚本变更时自动重建站点、回写 docs/ 并部署到 GitHub Pages。
# docs/ 目录的变更不再触发本流程，避免循环构建。
on:
  push:
    paths:
      - 'data/**'
      - 'build_site.py'
      - 'build_domain_index.py'
      - 'site/**'
      - 'tools/**'
      - '.github/workflows/build-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build site
        run: python3 build_site.py

      - name: Build domain qualification index
        run: python3 build_domain_index.py

      - name: Validate site
        run: python3 tools/validate_site.py

      - name: Commit generated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs BUILD.json VALIDATION.json
          if git diff --cached --quiet; then
            echo "无产物变更，跳过提交"
          else
            git commit -m "自动构建站点 $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
